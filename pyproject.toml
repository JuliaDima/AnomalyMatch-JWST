[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amjwst"
version = "0.1.0"
description = "JWST data preparation utilities for AnomalyMatch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astropy",
    "astroquery",
    "images-to-zarr",
    "matplotlib",
    "numpy",
    "opencv-python",
    "pandas",
    "Pillow",
    "pyarrow",
    "reproject",
    "scikit-learn",
    "shapely",
]

[project.scripts]
amjwst-footprints = "amjwst.make_datalabs_jwst_footprints:main"
amjwst-match-footprints = "amjwst.match_sources_to_datalabs_footprints:main"
amjwst-make-cutouts = "amjwst.make_cutouts:main"
amjwst-run-cutouts = "amjwst.run_all_cutouts:main"
amjwst-imgs-to-zarr = "amjwst.imgs_to_zarr:main"

[tool.setuptools.packages.find]
where = ["src"]
